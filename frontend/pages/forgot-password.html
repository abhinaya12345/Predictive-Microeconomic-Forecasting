<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Insights - Forgot Password</title>
    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/auth.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root{
          --bgA:#070f1e;
          --bgB:#0b1d3a;
          --bgC:#132a54;

          --blue:#60a5fa;
          --blue2:#3b82f6;
          --green:#22c55e;
          --amber:#f59e0b;

          --stroke: rgba(96,165,250,0.28);
          --strokeStrong: rgba(96,165,250,0.65);

          --card: rgba(15, 35, 65, 0.50);
          --card2: rgba(10, 22, 40, 0.25);

          --shadow: 0 22px 70px rgba(0,0,0,.45);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            color: white;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;

            /* ✅ reset-password style bg */
            background:
              radial-gradient(1100px 600px at 20% 5%, rgba(96,165,250,.18), transparent 55%),
              radial-gradient(900px 520px at 80% 30%, rgba(59,130,246,.16), transparent 60%),
              radial-gradient(900px 520px at 50% 120%, rgba(16,185,129,.14), transparent 60%),
              linear-gradient(180deg, var(--bgA), var(--bgB) 55%, var(--bgC));
        }

        /* Stars */
        .stars{
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: .95;
        }
        .star{
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }

        /* Glow blobs */
        .glow{
            position: fixed;
            inset:0;
            pointer-events:none;
            z-index:2;
            background:
              radial-gradient(800px 400px at 20% 10%, rgba(59,130,246,.22), transparent 60%),
              radial-gradient(700px 380px at 80% 20%, rgba(16,185,129,.16), transparent 60%),
              radial-gradient(900px 500px at 50% 120%, rgba(245,158,11,.10), transparent 60%);
            mix-blend-mode: screen;
            opacity:.9;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid rgba(59,130,246,0.20);
            background: rgba(10, 22, 40, 0.18);
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 650;
            letter-spacing:.2px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #f59e0b);
            border-radius: 8px;
            position: relative;
            box-shadow: 0 14px 35px rgba(59,130,246,.18);
            overflow:hidden;
        }
        .logo-icon::before,
        .logo-icon::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 2px;
            opacity:.95;
        }
        .logo-icon::before {
            width: 4px; height: 14px;
            left: 8px; bottom: 7px;
        }
        .logo-icon::after {
            width: 4px; height: 20px;
            left: 16px; bottom: 7px;
        }

        .nav-menu {
            display: flex;
            gap: 2.5rem;
            align-items: center;
            list-style: none;
        }

        .nav-menu a {
            color: rgba(255, 255, 255, 0.82);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.25s;
        }
        .nav-menu a:hover {
            color: #60a5fa;
            text-shadow: 0 0 18px rgba(96,165,250,.25);
        }

        .nav-menu .login-btn {
            border: 1px solid rgba(255, 255, 255, 0.28);
            padding: 0.55rem 1.75rem;
            border-radius: 12px;
            transition: all 0.25s;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(8px);
        }
        .nav-menu .login-btn:hover {
            border-color: rgba(96,165,250,0.75);
            background: rgba(96, 165, 250, 0.10);
            transform: translateY(-1px);
        }

        .content-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 3rem 2rem;
            position: relative;
            z-index: 10;
        }

        .content-header {
            margin-bottom: 2rem;
        }

        .content-header h1 {
            font-size: 2.25rem;
            margin-bottom: 1rem;
            font-weight: 650;
            letter-spacing:.2px;
        }

        .content-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.05rem;
            line-height: 1.5;
        }

        /* Card wrapper feel (keeps your layout the same) */
        .cardShell{
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 20px;
            padding: 22px 18px 18px;
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow);
            position: relative;
            overflow:hidden;
        }
        .cardShell::before{
            content:"";
            position:absolute; inset:-2px;
            background:
              radial-gradient(700px 160px at 25% 0%, rgba(96,165,250,.16), transparent 60%),
              radial-gradient(700px 160px at 85% 25%, rgba(34,197,94,.12), transparent 65%),
              radial-gradient(700px 200px at 50% 120%, rgba(59,130,246,.12), transparent 65%);
            opacity:.95;
            pointer-events:none;
        }
        .cardShell > *{ position: relative; z-index: 2; }

        .form-group { margin-bottom: 1.5rem; }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1.25rem;
            color: rgba(255, 255, 255, 0.55);
            font-size: 1.1rem;
            z-index: 2;
            user-select:none;
        }

        input[type="email"] {
            width: 100%;
            padding: 1rem 1.25rem 1rem 3.25rem;
            background: rgba(10, 20, 40, 0.48);
            border: 1px solid rgba(59, 130, 246, 0.28);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            transition: transform .2s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.4); }

        input:hover{
            transform: translateY(-1px);
            border-color: rgba(96,165,250,0.55);
        }

        input:focus {
            outline: none;
            border-color: rgba(96,165,250,0.90);
            background: rgba(10, 20, 40, 0.65);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.18);
            transform: translateY(-1px);
        }

        .hint{
            margin-top: 10px;
            font-size: .9rem;
            color: rgba(255,255,255,.68);
            display:flex;
            align-items:center;
            gap: 10px;
        }
        .hint .pill{
            display:inline-flex;
            align-items:center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(96,165,250,0.22);
            background: rgba(96,165,250,0.10);
            font-weight: 800;
            font-size: .78rem;
            color: rgba(255,255,255,.86);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.05rem;
            font-weight: 750;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .25s ease, filter .25s ease;
            margin-bottom: 1.5rem;
            box-shadow: 0 18px 45px rgba(59,130,246,.22);
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 60px rgba(59, 130, 246, 0.32);
            filter: brightness(1.03);
        }

        .btn-primary:disabled{
            opacity:.7;
            cursor:not-allowed;
            transform:none;
            box-shadow: 0 12px 26px rgba(0,0,0,.25);
        }

        /* ripple */
        .btn-primary::after{
            content:"";
            position:absolute;
            left: 50%;
            top: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,.22);
            transform: translate(-50%,-50%);
            border-radius: 999px;
            opacity:0;
            transition: width .5s ease, height .5s ease, opacity .7s ease;
        }
        .btn-primary:active::after{
            width: 520px;
            height: 520px;
            opacity: 1;
            transition: 0s;
        }

        .social-login {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            border: 1px solid rgba(59, 130, 246, 0.25);
            background: rgba(10, 20, 40, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform .2s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
            font-size: 1.2rem;
            font-weight: 900;
            color: white;
            user-select:none;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            border-color: rgba(96,165,250,0.65);
            background: rgba(59,130,246,0.12);
            box-shadow: 0 22px 45px rgba(0,0,0,.22);
        }

        .social-btn.google {
            background: rgba(234, 67, 53, 0.12);
            border-color: rgba(234, 67, 53, 0.26);
            color: #ffd1cc;
        }

        .social-btn.facebook {
            background: rgba(24, 119, 242, 0.12);
            border-color: rgba(24, 119, 242, 0.26);
            color: #dbeafe;
        }

        .social-btn.linkedin {
            background: rgba(10, 102, 194, 0.12);
            border-color: rgba(10, 102, 194, 0.26);
            color: #dbeafe;
        }

        .link-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }

        .link-text a {
            color: white;
            text-decoration: none;
            font-weight: 750;
            transition: all 0.25s;
        }

        .link-text a:hover {
            color: #60a5fa;
            text-shadow: 0 0 18px rgba(96,165,250,.25);
        }

        .success-message {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            padding: 1rem 1.25rem;
            border-radius: 14px;
            font-size: 0.95rem;
            box-shadow: 0 18px 50px rgba(16, 185, 129, 0.25);
            opacity: 0;
            transition: opacity 0.28s ease, transform .28s ease;
            z-index: 100;
            text-align: center;
            max-width: min(560px, 92vw);
        }

        .success-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 1.5rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.875rem;
            z-index: 10;
            background: rgba(10, 22, 40, 0.14);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(59,130,246,0.12);
        }

        @media (max-width: 768px) {
            nav { padding: 1rem 1.25rem; }
            .content-container { padding: 2rem 1.25rem; }
            .content-header h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="glow"></div>

    <nav>
        <div class="logo">
            <div class="logo-icon"></div>
            <span>Business Insights</span>
        </div>
        <ul class="nav-menu">
            <li><a href="/home">Home</a></li>
            <li><a href="/home#features">Features</a></li>
            <li><a href="/home#about">About</a></li>
            <li><a href="/login" class="login-btn">Log In</a></li>
        </ul>
    </nav>

    <div class="content-container">
        <div class="content-header">
            <h1>Forgot Your Password?</h1>
            <p>We'll send you a link to reset it.</p>
        </div>

        <div class="cardShell">
            <form onsubmit="sendResetLink(event)">
                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input id="email" type="email" placeholder="Email Address" required />
                    </div>
                    <div class="hint">
                        <span class="pill">Tip</span>
                        <span>Use the same email you used to sign up.</span>
                    </div>
                </div>

                <button id="sendBtn" type="submit" class="btn-primary">Send Reset Link</button>
            </form>

            <div class="social-login">
                <button class="social-btn google" type="button" onclick="socialLogin('google')">G</button>
                <button class="social-btn facebook" type="button" onclick="socialLogin('facebook')">f</button>
                <button class="social-btn linkedin" type="button" onclick="socialLogin('linkedin')">in</button>
            </div>

            <div class="link-text">
                Already have an account? <a href="/login">Log In</a>
            </div>
        </div>
    </div>

    <div id="successMessage" class="success-message">
        Password reset link has been sent to your email!
    </div>

    <footer>
        © 2024 BusinessInsights. All rights reserved.
    </footer>

    <script>
        // Stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 160; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.opacity = (0.25 + Math.random() * 0.75).toFixed(2);
            starsContainer.appendChild(star);
        }

        function validEmail(v){
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
        }

        function sendResetLink(e) {
            e.preventDefault();

            const input = document.getElementById("email");
            const email = input.value.trim();
            const btn = document.getElementById("sendBtn");

            if(!validEmail(email)){
              input.focus();
              input.style.borderColor = "rgba(239,68,68,0.85)";
              setTimeout(()=> input.style.borderColor = "", 900);
              return;
            }

            // disable button + feedback
            btn.disabled = true;
            const oldTxt = btn.textContent;
            btn.textContent = "Sending...";

            const successMessage = document.getElementById('successMessage');
            successMessage.textContent = `Password reset link has been sent to ${email}`;
            successMessage.classList.add('show');

            // Redirect to verification page after 2 seconds
            setTimeout(() => {
                window.location.href = '/verification';
            }, 2000);

            // (in case redirect is blocked)
            setTimeout(() => {
              btn.disabled = false;
              btn.textContent = oldTxt;
            }, 2200);
        }

        function socialLogin(provider) {
            alert('Logging in with ' + provider);
        }
    </script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/auth.js"></script>

</body>
</html>
